<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>营养配方盘 · 一起吃到底吃了多少</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#fffdf9; --line:#e2ddd2; --line2:#efeae0;
  --ink:#23211d; --ink2:#5a554b; --ink3:#8d8678;
  --accent:#1f6b52; --accent-bg:#e8f2ed;
  --warn:#8a4b12; --warn-bg:#fbf0e2;
  --danger:#8f2f2f; --danger-bg:#fbecec;
  --header-bg:rgba(245,243,238,.94); --field:#fff; --inverse:#fff; --overlay:rgba(30,28,24,.35);
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(35,33,29,.035), 0 5px 16px -12px rgba(35,33,29,.28);
  --shadow-lift:0 2px 6px rgba(35,33,29,.06), 0 10px 26px -14px rgba(35,33,29,.34);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
html[data-theme="night"]{
  color-scheme:dark;
  --bg:#171c19; --panel:#222924; --line:#3a453e; --line2:#2d3731;
  --ink:#edf3ef; --ink2:#c4d0c8; --ink3:#93a198;
  --accent:#70caa0; --accent-bg:#1f3b30;
  --warn:#efb477; --warn-bg:#3f2d1c;
  --danger:#ef9a9a; --danger-bg:#442523;
  --header-bg:rgba(23,28,25,.94); --field:#1b211d; --inverse:#171c19; --overlay:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 5px 16px -12px rgba(0,0,0,.72);
  --shadow-lift:0 2px 6px rgba(0,0,0,.25), 0 10px 26px -14px rgba(0,0,0,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:64px;
}
html.sheet-open,body.sheet-open{overflow:hidden}
body.sheet-open{position:fixed;left:0;right:0;width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--header-bg);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:4px;padding:12px 0 10px;transition:padding .2s ease}
.hd h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.hd .sub{font-size:11.5px;color:var(--ink3);margin-left:auto;font-family:var(--mono);white-space:nowrap}
.hd-tools{display:flex;align-items:center;gap:6px;flex:none;touch-action:manipulation}
.hd-tool{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink2);line-height:1}
.hd-tool:active{background:var(--line2)}
.hd-tool .ico{font-size:15px;line-height:1}
.zoom-group{display:flex;align-items:center;height:34px;overflow:hidden;border:1px solid var(--line);
  border-radius:8px;background:var(--panel)}
.zoom-btn{width:30px;height:32px;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--ink2)}
.zoom-btn:active{background:var(--line2)}
.zoom-btn:disabled{opacity:.3;cursor:default}
.zoom-val{min-width:34px;padding:0 2px;text-align:center;border-left:1px solid var(--line);
  border-right:1px solid var(--line);font-family:var(--mono);font-size:9.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.hd-toggle{display:none;flex:none;width:34px;height:34px;margin-left:2px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink2);place-items:center}
.hd-toggle::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(-135deg) translate(-1px,-1px)}
header.can-collapse .hd{cursor:pointer}
header.can-collapse .hd-toggle{display:grid}
header.is-collapsed .hd{padding:7px 0}
header.is-collapsed .hd-toggle::before{transform:rotate(45deg) translate(-1px,-1px)}
.selbar{padding-bottom:6px;max-height:100vh;overflow:hidden;opacity:1;
  transition:max-height .24s ease,opacity .16s ease,padding .24s ease}
header.is-collapsed .selbar{max-height:0;padding-bottom:0;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 12px;width:100%;max-width:100%;
  box-shadow:var(--shadow);
}
.chip .nm{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.45;white-space:normal;
  overflow-wrap:anywhere}
.chip .stp{display:flex;align-items:center;gap:1px;flex:none;margin-left:auto}
.chip .stp button{width:20px;height:20px;border-radius:50%;background:var(--line2);color:var(--ink2);
  display:grid;place-items:center;font-size:13px;line-height:1;font-weight:600}
.chip .stp button:active{background:var(--line)}
.chip input{
  width:52px;text-align:center;border:1px solid transparent;border-radius:7px;
  background:transparent;padding:3px 0;font-family:var(--mono);font-size:16px;
  font-variant-numeric:tabular-nums;touch-action:manipulation;
}
.chip input:focus{outline:none;border-color:var(--line);background:var(--field)}
.chip .un{font-size:11px;color:var(--ink3)}
.chip .x{width:20px;height:20px;border-radius:50%;background:transparent;color:var(--ink3);
  display:grid;place-items:center;font-size:15px;line-height:1}
.chip .x:hover{background:var(--line2);color:var(--ink)}
.chip-actions{display:flex;align-items:center;gap:12px;flex:0 0 100%;min-height:32px}
/* 吸顶汇总条 */
.sumbar{display:none;gap:14px;overflow-x:auto;padding:7px 0 9px;border-top:1px solid var(--line2);
  margin-top:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sumbar::-webkit-scrollbar{display:none}
.sumbar .si{display:flex;align-items:baseline;gap:4px;flex:none;font-size:11.5px;color:var(--ink3)}
.sumbar .si b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sumbar .si i{font-style:normal;font-size:10px;color:var(--ink3)}
.sumbar .lbl{flex:none;font-size:11px;color:var(--ink3);letter-spacing:.04em}
.addbtn{
  border:1px dashed var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;
  color:var(--accent);background:var(--accent-bg);
}
.ghost{font-size:12.5px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}

/* ---------- 区块 ---------- */
section{margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
#main{counter-reset:main-sec}
#main > section{counter-increment:main-sec}
#elements{--sec-c:#A9734A;--sec-rgb:169,115,74}
#elec{--sec-c:#37698F;--sec-rgb:55,105,143}
#ingredients{--sec-c:#1f6b52;--sec-rgb:31,107,82}
#how{--sec-c:#B07C28;--sec-rgb:176,124,40}
#notes{--sec-c:#8f2f2f;--sec-rgb:143,47,47}
html[data-theme="night"] #elements{--sec-c:#dfad7d;--sec-rgb:223,173,125}
html[data-theme="night"] #elec{--sec-c:#8db7df;--sec-rgb:141,183,223}
html[data-theme="night"] #ingredients{--sec-c:#80caa8;--sec-rgb:128,202,168}
html[data-theme="night"] #how{--sec-c:#dfbd72;--sec-rgb:223,189,114}
html[data-theme="night"] #notes{--sec-c:#e3a1a1;--sec-rgb:227,161,161}
.sect-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:0 0 14px;
  min-height:47px;padding:4px 0 11px 2px;border-bottom:3px solid var(--line2);position:relative}
.sect-head::before{content:counter(main-sec,decimal-leading-zero);position:absolute;left:-3px;top:-12px;
  font-size:58px;font-weight:900;line-height:.9;letter-spacing:-.07em;pointer-events:none;user-select:none;
  background:linear-gradient(135deg,rgba(var(--sec-rgb),.58) 12%,rgba(var(--sec-rgb),.12) 88%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  opacity:.72;z-index:0}
.sect-head::after{content:'';position:absolute;left:0;bottom:-3px;width:88px;height:3px;
  border-radius:2px;background:linear-gradient(90deg,var(--sec-c),rgba(var(--sec-rgb),0))}
.sect-head h2{display:flex;align-items:center;gap:8px;font-size:20px;margin:0;font-weight:800;
  letter-spacing:.01em;color:var(--ink);line-height:1.35;position:relative;z-index:1}
.sect-head h2::before{content:'';flex:none;width:4px;height:22px;border-radius:2px;background:var(--sec-c)}
.sect-head .hint{position:relative;z-index:1;margin-left:auto;max-width:100%;font-size:11.5px;line-height:1.4;
  color:var(--sec-c);background:rgba(var(--sec-rgb),.08);border:1px solid rgba(var(--sec-rgb),.2);
  border-radius:999px;padding:2px 9px;text-align:right}
@media(max-width:480px){.sect-head .hint{font-size:11px;padding:2px 8px}}
.pad{padding:14px}

/* 空态 */
.empty{text-align:center;padding:44px 20px;color:var(--ink2)}
.empty .ico{width:52px;height:52px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;opacity:.5}
.empty .ico i{border-radius:3px;background:var(--line)}
.empty .ico i:nth-child(1),.empty .ico i:nth-child(5),.empty .ico i:nth-child(9){background:var(--accent);opacity:.55}
.empty .big{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 0 18px;font-size:13.5px;line-height:1.8}
.quick-hd{display:flex;align-items:center;justify-content:center;gap:9px;margin:20px 0 11px;font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.quick-hd::before,.quick-hd::after{content:'';width:26px;height:1px;background:var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:566px;margin:0 auto}
.quick button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* 提示条 */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.6}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--accent-bg);color:var(--accent)}
.alert.danger{background:var(--danger-bg);color:var(--danger)}
.alert b{font-weight:700}

/* 元素表 */
.el-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:10px}
.el-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px 11px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.el-cell::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,#c9c2b4);opacity:.9}
.el-cell .el-hd{display:flex;align-items:center;gap:7px}
.el-cell .el-hd .sym{display:flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:12px;font-weight:600;color:var(--c,var(--ink2));letter-spacing:.04em}
.el-cell .el-hd .dot{width:6px;height:6px;border-radius:50%;background:var(--c,#c9c2b4);flex:none}
.el-cell .el-hd .cn{margin-left:auto;font-size:16px;font-weight:700;line-height:1.2;
  color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.el-cell .v{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.12;margin-top:5px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.el-cell .v small{font-size:11px;font-weight:400;color:var(--ink3);margin-left:3px;font-family:inherit;letter-spacing:0}
.el-cell .src{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 电解质平衡（钠钾镁） */
.elec{padding:13px 15px 12px}
.ec-row{padding:11px 0 10px;border-top:1px dashed var(--line2)}
.ec-row:first-child{border-top:0;padding-top:1px}
.ec-top{display:flex;align-items:center;gap:9px}
.ec-nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  color:var(--ink);flex:none;min-width:64px}
.ec-nm i{width:7px;height:7px;border-radius:50%;background:var(--c,#c9c2b4);flex:none}
.ec-nm .ec-cn{font-size:17px;line-height:1.2;color:var(--ink);letter-spacing:.02em}
.ec-nm em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:400;
  color:var(--ink3);letter-spacing:.04em}
.ec-val{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.ec-val small{font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:2px;letter-spacing:0}
.ec-tag{margin-left:auto;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:999px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.ec-tag.ok{background:var(--accent-bg);color:var(--accent)}
.ec-tag.low{background:var(--warn-bg);color:var(--warn)}
.ec-tag.high{background:var(--danger-bg);color:var(--danger)}
.ec-tag.na{background:var(--line2);color:var(--ink3);font-weight:400}
.ec-bar{position:relative;height:7px;border-radius:999px;background:var(--line2);
  margin:8px 0 5px;overflow:hidden}
.ec-zone{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.25}
.ec-mark{position:absolute;top:0;bottom:0;width:1.5px;background:var(--accent);opacity:.6}
.ec-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--c,#8d8678);
  opacity:.9;transition:width .35s ease}
.ec-row.st-high .ec-fill{background:var(--danger);opacity:1}
.ec-row.st-na .ec-fill{background:transparent}
.ec-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.ec-foot .gk{color:var(--ink2)}
.ec-ratio{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.ec-ratio b{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:600;
  font-variant-numeric:tabular-nums}
.ec-ratio .rk{margin-left:auto;font-size:11.5px;padding:2px 9px;border-radius:999px}
.ec-ratio .rk.ok{background:var(--accent-bg);color:var(--accent)}
.ec-ratio .rk.off{background:var(--warn-bg);color:var(--warn)}
.ec-sug{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line2)}
.ec-sug .lb{display:block;font-size:11px;color:var(--ink3);letter-spacing:.03em;margin-bottom:8px}
.ec-sug-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ec-sug-i{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,#8d8678);
  border-radius:var(--r-sm);padding:9px 26px 8px 10px;box-shadow:var(--shadow);text-align:left}
.ec-sug-i:active{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 8%,var(--panel))}
.ec-sug-i .n{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-sug-i .v{display:flex;align-items:baseline;gap:4px;margin-top:2px;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.ec-sug-i .v b{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.035em;
  color:var(--c,#1f6b52)}
.ec-sug-i .v span{font-size:12px;color:var(--ink3)}
.ec-sug-i .pick{display:block;margin-top:4px;font-size:9.5px;line-height:1.3;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-sug-i .plus{position:absolute;top:7px;right:7px;width:17px;height:17px;display:grid;
  place-items:center;border-radius:50%;background:var(--c,var(--accent));color:var(--inverse);
  font-size:12px;font-weight:700;line-height:1}
.ec-sug .ec-note{display:block;margin-top:8px;font-size:11px;color:var(--ink3);line-height:1.5}
@media(max-width:400px){
  .ec-sug-list{gap:6px}
  .ec-sug-i{padding:8px 7px 7px}
  .ec-sug-i .n{font-size:11px}
  .ec-sug-i .v b{font-size:21px}
}

/* 缺口补充产品选择 */
.gap-sheet .panel{max-height:min(78vh,640px)}
.gap-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px}
.gap-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);text-align:left;margin-bottom:8px;box-shadow:var(--shadow)}
.gap-opt .tx{flex:1;min-width:0}
.gap-opt .nm{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.gap-opt .meta{display:block;margin-top:3px;font-size:11.5px;line-height:1.45;color:var(--ink3)}
.gap-opt .add{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  background:var(--accent-bg);color:var(--accent);font-size:17px;font-weight:600}
.gap-opt:active,.gap-opt.on{border-color:var(--accent);background:var(--accent-bg)}

/* 成分清单 */
.grp{border-top:1px solid var(--line2)}
.grp:first-child{border-top:0}
.grp-hd{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;text-align:left;background:none}
.grp-hd .t{font-size:13.5px;font-weight:700}
.grp-hd .n{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.grp-hd .arw{margin-left:auto;color:var(--ink3);font-size:12px;transition:.15s}
.grp[data-open="1"] .grp-hd .arw{transform:rotate(90deg);display:inline-block}
.grp-bd{display:none;padding:0 14px 10px}
.grp[data-open="1"] .grp-bd{display:block}
.row{display:flex;gap:10px;padding:9px 14px;border-top:1px dashed var(--line2);align-items:flex-start}
.row:first-child{border-top:0}
.row .no{flex:none;width:24px;padding-top:1px;font-family:var(--mono);font-size:11.5px;
  font-weight:600;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
.row .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.5}
.row .nm .ing-name{font-size:15px;font-weight:600;line-height:1.5;color:var(--ink)}
.row .cls{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.02em;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.row .cls::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c,#cfc8b9);flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;margin:0 0 9px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{white-space:nowrap;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.fchips button.on{background:var(--ink);color:var(--inverse);border-color:var(--ink)}
.row .nm .al{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.row .val{flex:none;font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .split{display:flex;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--ink3);
  margin-top:3px;line-height:1.5;font-family:var(--mono)}
.row .split-i{display:inline-flex;align-items:center;padding:1px 8px 1px 0;white-space:nowrap}
.row .split-i + .split-i{padding-left:8px;border-left:2px solid var(--sc,var(--accent))}
.row .raw-note{display:block;margin-top:1px;font-size:10.5px;line-height:1.45;color:var(--ink3);font-family:var(--mono)}
.multi{background:var(--accent-bg);border-radius:5px;padding:0 5px;font-size:10.5px;color:var(--accent);margin-left:4px;font-family:inherit}

/* 合计用量：--hc / --hc-rgb 由 howHTML() 按产品注入，单产品时退回默认墨绿 */
.how-item{--hc:var(--accent);--hc-rgb:31,107,82;position:relative;padding:12px 14px 13px;
  border-top:1px solid var(--line2)}
.how-item:first-child{border-top:0}
.hw-top{display:flex;align-items:flex-start;gap:10px}
.hw-no{flex:none;display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:19px;padding:0 5px;margin-top:1px;box-sizing:border-box;
  background:linear-gradient(135deg,var(--hc),rgba(var(--hc-rgb),.68));color:#fff;
  font:700 10.5px/1 var(--mono);letter-spacing:.02em;
  border-radius:3px 0 3px 0;transform:skewX(-10deg);
  box-shadow:0 2px 5px rgba(var(--hc-rgb),.18)}
.hw-no span{display:inline-block;transform:skewX(10deg)}
.hw-top .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.45;cursor:pointer}
.hw-info-btn{flex:none;width:24px;height:24px;margin-top:1px;display:grid;place-items:center;
  border:1px solid rgba(var(--hc-rgb),.28);border-radius:7px;color:var(--hc);
  background:rgba(var(--hc-rgb),.06)}
.hw-info-btn svg{width:14px;height:14px}
.hw-info-btn:active{background:rgba(var(--hc-rgb),.13)}
.hw-qty{position:relative;flex:none;min-width:76px;padding:5px 5px 5px 16px;
  text-align:right;white-space:nowrap}
.hw-qty::before{content:"";position:absolute;z-index:0;top:-12px;right:-14px;
  width:96px;height:47px;pointer-events:none;
  background:linear-gradient(220deg,rgba(var(--hc-rgb),.18) 0%,rgba(var(--hc-rgb),.09) 58%,rgba(var(--hc-rgb),0) 100%);
  border-top:2px solid var(--hc);border-right:2px solid var(--hc);
  border-radius:0 12px 0 30px}
.hw-qty b,.hw-qty i{position:relative;z-index:1}
.hw-qty b{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--hc)}
.hw-qty i{font-style:normal;font-size:11px;font-weight:600;color:var(--hc);margin-left:3px}
.hw-tags{margin-top:2px}
.tag{display:inline-block;font-size:11.5px;padding:1.5px 8px;border-radius:5px;background:var(--line2);color:var(--ink2);margin:5px 5px 0 0;line-height:1.5}
.tag.ng{background:var(--danger-bg);color:var(--danger)}
.tag.ng::before{content:"✕";font-size:9px;margin-right:3px;opacity:.7}
.hw-dose{display:flex;gap:6px;margin-top:5px;align-items:flex-start}
.hw-dose .k{flex:none;font-size:10.5px;color:var(--ink3);line-height:1.95;letter-spacing:.02em;width:23px}
.hw-dose .v{flex:1;min-width:0;font-size:13px;line-height:1.6;color:var(--ink2)}
.hw-more{margin-top:9px}
.hw-more summary{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;
  padding:7px 10px;border:1px solid rgba(var(--hc-rgb),.32);border-radius:var(--r-sm);background:var(--bg);
  font-size:12.5px;font-weight:600;color:var(--hc);cursor:pointer;list-style:none;
  transition:background .15s,border-color .15s}
.hw-more summary::-webkit-details-marker{display:none}
.hw-more summary::before{content:"+";display:grid;place-items:center;flex:none;
  width:17px;height:17px;border-radius:50%;background:var(--hc);color:#fff;
  font-family:var(--mono);font-size:13px;font-weight:700;line-height:1}
.hw-more summary:hover{border-color:var(--hc);background:rgba(var(--hc-rgb),.07)}
.hw-more .t{flex:1;min-width:0}
.hw-more .close-t{display:none}
.hw-more .cnt{flex:none;font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--hc);background:rgba(var(--hc-rgb),.11);border-radius:999px;padding:1px 8px}
.hw-more[open] summary{background:rgba(var(--hc-rgb),.09);border-color:rgba(var(--hc-rgb),.55)}
.hw-more[open] summary::before{content:"−"}
.hw-more[open] .open-t{display:none}
.hw-more[open] .close-t{display:inline}
.hw-more .bd{margin-top:9px;padding:0;border-left:0}
.hw-sec{margin:0 0 8px;border:1px solid rgba(var(--hc-rgb),.22);border-radius:var(--r-sm);
  background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.hw-sec:last-child{margin-bottom:0}
.hw-sec .hd{display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:rgba(var(--hc-rgb),.06);border-bottom:1px solid rgba(var(--hc-rgb),.18);
  border-left:3px solid var(--hc)}
.hw-sec .no{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:700;
  color:#fff;background:var(--hc);border-radius:5px;padding:1px 5px;letter-spacing:.02em}
.hw-sec .hd h4{margin:0;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.hw-sec .ct{padding:9px 11px 10px}
.hw-sec .ct > :last-child{margin-bottom:0}
.hw-sec .ct hr:last-child{display:none}
details{margin-top:7px}
details summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";font-family:var(--mono);font-size:12px;color:var(--ink3);width:9px;text-align:center}
details[open] summary::before{content:"−"}
details .bd{font-size:13px;color:var(--ink2);line-height:1.75;padding:6px 0 0 14px;border-left:2px solid var(--line2);margin-top:6px}
details .bd p{margin:0 0 8px}
details .bd ul,details .bd ol{margin:0 0 8px;padding-left:18px}
details .bd li{margin:2px 0}
details .bd h3,details .bd h4{font-size:13px;margin:8px 0 4px;color:var(--ink)}
details .bd blockquote{margin:0 0 8px;padding:6px 10px;background:var(--bg);border-left:2px solid var(--line);border-radius:0 6px 6px 0}
details .bd hr{border:0;border-top:1px dashed var(--line2);margin:10px 0}

/* 注意事项 */
.note{display:flex;gap:9px;padding:7px 14px;border-top:1px solid var(--line2);
  font-size:13.5px;line-height:1.6;color:var(--ink2)}
.note:first-child{border-top:0}
.note > .no{flex:none;width:22px;padding-top:2px;font-family:var(--mono);font-size:11.5px;
  font-weight:600;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.note > .txt{flex:1;min-width:0}
.note p{margin:0}
.note p + p{margin-top:5px}
.note hr{display:none}
.note .who{font-size:11.5px;color:var(--accent);margin-top:3px}
.note.note-more{color:var(--ink3)}
.note.dis{display:none}

/* 弹层 */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:var(--overlay);overscroll-behavior:contain}
.sheet.on{display:block}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--bg);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overscroll-behavior:contain;
}
.sheet .ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.sheet .ph h3{margin:0 0 10px;font-size:15px}
#picker .panel{
  height:min(88vh,760px);max-height:min(88vh,760px);
  height:min(88dvh,760px);max-height:min(88dvh,760px);
}
.sheet .ph .sheet-close{
  position:absolute;top:10px;right:12px;z-index:2;padding:4px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);font-size:13px;color:var(--ink2);line-height:1.4;
}
.sheet .ph .sheet-close:active{background:var(--line2)}
.search{width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:16px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,107,82,.08)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.filters button.on{background:var(--ink);color:var(--inverse);border-color:var(--ink)}
.plist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 10px 20px}
.pgroup{font-size:11.5px;color:var(--ink3);padding:12px 6px 5px;font-family:var(--mono)}
.pitem{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;text-align:left}
.pitem:active{background:var(--line2)}
.pitem.on{background:var(--accent-bg)}
.pitem .id{font-family:var(--mono);font-size:11px;color:var(--ink3);width:34px;flex:none}
.pitem .tx{flex:1;min-width:0}
.pitem .tx .n{display:block;font-size:14px;font-weight:600;line-height:1.4}
.pitem .n em{font-style:normal;color:var(--accent);background:rgba(31,107,82,.10);border-radius:3px}
.pitem .whyhit{display:block;font-size:11px;color:var(--accent);margin-top:2px;line-height:1.4}
.pcount{font-size:11.5px;color:var(--ink3);padding:4px 6px 2px}
.pitem .tx .m{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .plus{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:16px;flex:none}
.pitem.on .plus{background:var(--accent);color:var(--inverse)}

/* 产品详情面板 */
.dsheet .panel{max-height:92vh}
.dsheet .ph{position:relative;padding-right:16px}
.dsheet .ph h3{
  margin:0;padding-right:158px;font-size:15px;line-height:1.45;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
}
.detail-tools{position:absolute;top:10px;right:12px;z-index:2;display:flex;align-items:center;gap:6px}
.dsheet .ph .sheet-close{position:static;padding:4px 9px;background:var(--bg)}
.dbody{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;padding:4px 16px 30px;font-size:13.5px;line-height:1.8;color:var(--ink2)
}
.dmeta{font-size:12px;color:var(--ink3);margin:6px 0 2px}
.d-oneline{margin:0;padding:11px 13px;border:1px solid rgba(31,107,82,.18);
  border-left:3px solid var(--accent);border-radius:8px;background:var(--accent-bg);
  color:var(--ink);font-size:14px;line-height:1.75}
.d-advice{margin:12px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);line-height:1.65}
.dsec{margin:0;padding:16px 0 9px;border-top:1px solid var(--line)}
.dsec:first-of-type{border-top-color:var(--line)}
.dsec h2{
  display:flex;align-items:center;gap:9px;margin:0 0 10px;padding:0;font-size:17px;
  font-weight:700;line-height:1.45;color:var(--ink);letter-spacing:.01em;
}
.dsec h2::before{content:"";flex:none;width:4px;height:17px;border-radius:2px;background:var(--accent)}
.dsec-dose{padding-top:20px;border-top:2px solid var(--accent)}
.dsec-dose h2{font-size:20px;color:var(--accent)}
.dsec-dose h2::before{width:5px;height:21px}
.dsec-oneline h2{color:var(--accent)}
.dsec-notes h2{color:var(--danger)}
.dsec-notes h2::before{background:var(--danger)}
.dsec-body > :last-child{margin-bottom:0}
.dsec-body > hr:last-child{display:none}
.dbody p{margin:0 0 9px}
.dbody ul,.dbody ol{padding-left:19px;margin:0 0 9px}
.dbody blockquote{margin:0 0 9px;padding:7px 11px;background:var(--panel);border-left:2px solid var(--line);border-radius:0 6px 6px 0}

/* AI 功用科普 */
.ai-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none;
  min-height:30px;padding:4px 10px;border:1px solid rgba(31,107,82,.24);border-radius:999px;
  background:var(--accent-bg);color:var(--accent);font-size:11.5px;font-weight:600;white-space:nowrap}
.ai-btn svg{width:14px;height:14px;flex:none}
.ai-btn:active{filter:brightness(.96)}
.ai-btn.strong{background:var(--accent);border-color:var(--accent);color:var(--inverse);
  box-shadow:var(--shadow-lift)}
.ai-combo-row{display:flex;justify-content:flex-start;margin:-2px 0 10px}
.ai-combo-row .ai-btn{width:100%;min-height:40px;justify-content:flex-start;padding:8px 12px;
  font-size:13px;border-radius:9px}
.hw-ai-row{display:flex;margin:7px 0 1px}
.hw-ai-row .ai-btn{width:100%;min-height:34px;justify-content:center;
  background:var(--hc,var(--accent));border-color:var(--hc,var(--accent));color:#fff}
.hw-ai-row.has-case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
.hw-ai-row.has-shop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.hw-ai-row.has-case.has-shop{grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.hw-case-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;
  padding:4px 10px;border:1px solid rgba(var(--hc-rgb),.34);border-radius:999px;
  background:var(--panel);color:var(--hc);font-size:11.5px;font-weight:700;white-space:nowrap}
.hw-case-btn b{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:0 5px;
  border-radius:999px;background:rgba(var(--hc-rgb),.1)}
.hw-case-btn:active{background:rgba(var(--hc-rgb),.08)}
.hw-buy-link{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:34px;
  padding:4px 9px;border:1px solid rgba(var(--hc-rgb),.34);border-radius:999px;
  background:rgba(var(--hc-rgb),.06);color:var(--hc);font-size:11.5px;font-weight:700;
  text-decoration:none;white-space:nowrap}
.hw-buy-link svg{width:13px;height:13px;flex:none}
.hw-buy-link:active{background:rgba(var(--hc-rgb),.12)}
.ai-sheet .panel{height:min(82vh,720px);max-height:min(82vh,720px);
  height:min(82dvh,720px);max-height:min(82dvh,720px)}
.ai-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px}
.ai-context{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12px;color:var(--ink2)}
.ai-context b{color:var(--ink);font-size:13px}
.ai-context span{color:var(--ink3)}
.ai-label{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 7px;letter-spacing:.02em}
.ai-prompt{display:block;width:100%;height:290px;min-height:190px;resize:vertical;padding:11px 12px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field);color:var(--ink);
  font-size:12.5px;line-height:1.7;outline:none}
.ai-prompt:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,107,82,.08)}
.ai-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;
  font-size:10.5px;color:var(--ink3)}
.ai-reset{padding:2px 0;color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ai-primary,.ai-secondary{min-height:42px;border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600}
.ai-primary{background:var(--accent);color:var(--inverse);box-shadow:var(--shadow)}
.ai-secondary{border:1px solid var(--line);background:var(--field);color:var(--ink2)}
.ai-status{margin-top:11px;padding:9px 11px;border-radius:var(--r-sm);background:var(--line2);
  font-size:11.5px;line-height:1.65;color:var(--ink2)}
.ai-status.ok{background:var(--accent-bg);color:var(--accent)}
.ai-status.bad{background:var(--danger-bg);color:var(--danger)}
.ai-status a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* 相关案例 */
.case-sheet{--case-fs:1}
.case-sheet.case-large{--case-fs:1.16}
.case-sheet .panel{height:min(88vh,780px);max-height:min(88vh,780px);
  height:min(88dvh,780px);max-height:min(88dvh,780px)}
.case-sheet .ph{position:relative;padding:14px 100px 10px 16px}
.case-sheet .ph h3{margin:0;font-size:calc(15px * var(--case-fs));line-height:1.45;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.case-head-tools{position:absolute;top:10px;right:12px;z-index:2;display:flex;align-items:center;gap:6px}
.case-zoom-btn{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink2);font-family:var(--mono);
  font-size:11px;font-weight:700;line-height:1}
.case-sheet .ph .sheet-close{position:static;padding:4px 9px;background:var(--bg)}
.case-lead{flex:none;padding:9px 16px;border-bottom:1px solid var(--line);
  background:var(--warn-bg);color:var(--warn);font-size:calc(11.5px * var(--case-fs));line-height:1.55}
.case-filters{flex:none;display:flex;gap:6px;overflow-x:auto;padding:9px 12px;
  border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none}
.case-filters::-webkit-scrollbar{display:none}
.case-filter{white-space:nowrap;padding:5px 8px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);color:var(--ink2);font-size:calc(11.5px * var(--case-fs));line-height:1.45}
.case-filter b{font-family:var(--mono);font-size:calc(10.5px * var(--case-fs));margin-left:3px;color:var(--ink3)}
.case-filter.on{background:var(--accent);border-color:var(--accent);color:var(--inverse);font-weight:700}
.case-filter.on b{color:inherit;opacity:.8}
@media(max-width:360px){.case-filters{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
  .case-filter{text-align:center}}
.case-sort{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.case-sort .lbl{font-size:calc(11px * var(--case-fs));color:var(--ink3);margin-right:2px}
.case-sort button{padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--ink2);font-size:calc(11px * var(--case-fs));line-height:1.45}
.case-sort button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.case-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:12px 16px 24px;font-size:calc(12.5px * var(--case-fs))}
.case-item{padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);box-shadow:var(--shadow)}
.case-item + .case-item{margin-top:9px}
.case-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.case-user{display:inline-flex;align-items:center;min-height:23px;padding:2px 9px;
  border-radius:999px;background:var(--accent);color:var(--inverse);
  font-size:calc(11.5px * var(--case-fs));font-weight:700;line-height:1.4}
.case-id{font-family:var(--mono);font-size:calc(10.5px * var(--case-fs));color:var(--ink3)}
.case-badge{margin-left:auto;padding:3px 9px;border-radius:999px;background:var(--line2);
  color:var(--ink2);font-size:calc(10.5px * var(--case-fs));font-weight:700;line-height:1.4}
.case-badge.good{background:var(--accent);color:var(--inverse)}
.case-badge.mid{background:var(--warn-bg);color:var(--warn)}
.case-badge.disc{background:var(--warn-bg);color:var(--warn)}
.case-problem{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin:2px 0 8px;
  font-size:calc(11.5px * var(--case-fs));line-height:1.6;color:var(--ink2)}
.case-problem b{flex:none;color:var(--ink3);font-weight:600}
.case-problem span{padding:1px 7px;border-radius:5px;background:var(--accent-bg);color:var(--accent)}
.case-block{margin-top:7px;padding:8px 10px;border-left:3px solid var(--line);
  border-radius:6px;line-height:1.65}
.case-block.supp{background:var(--warn-bg);border-left-color:var(--warn)}
.case-block.effect{background:rgba(107,94,152,.08);border-left-color:#6B5E98}
.case-label{display:block;margin-bottom:3px;font-size:calc(10.5px * var(--case-fs));font-weight:700;
  letter-spacing:.02em;color:var(--ink3)}
.case-block.supp .case-label{color:var(--warn)}
.case-block.effect .case-label{color:#6B5E98}
.case-effect{font-size:calc(12.5px * var(--case-fs));line-height:1.7;color:var(--ink2)}
.case-supp{display:flex;flex-wrap:wrap;gap:4px}
.case-supp span{padding:2px 8px;border-radius:999px;background:var(--panel);
  border:1px solid rgba(138,75,18,.14);

.case-story{margin-top:8px;padding:7px 10px;border-radius:6px;border-left:3px solid var(--line);

.case-imgs{display:flex;flex-direction:column;gap:8px;margin:0}
.case-img-item{position:relative;min-height:80px;border-radius:6px;background:var(--line2)}
.case-imgs img{display:block;width:100%;height:auto;object-fit:contain;border-radius:6px;
  border:1px solid var(--line);background:var(--line2);cursor:zoom-in}
.case-img-item img[hidden]{display:none}
.case-img-retry{position:absolute;inset:0;width:100%;min-height:110px;border:1px dashed var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink3);font-size:calc(12px * var(--case-fs));line-height:1.7}
.case-img-retry[hidden]{display:none}
.case-more{display:block;width:100%;margin-top:10px;min-height:40px;border:1px solid var(--line);

.case-lightbox{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(10,12,11,.92)}
.case-lightbox.on{display:flex}
.case-lightbox-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;user-select:none}
.case-lightbox-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;
  transform-origin:center center;will-change:transform;pointer-events:none;-webkit-user-drag:none}
.case-lightbox-close{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:2;
  width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.38);
  border-radius:50%;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(8px)}
.case-lightbox-close svg,.case-lightbox-nav svg{width:20px;height:20px}
.case-lightbox-nav{position:fixed;top:50%;z-index:2;width:40px;height:48px;display:grid;place-items:center;
  transform:translateY(-50%);border-radius:10px;border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.38);color:#fff}
.case-lightbox-nav.prev{left:10px}
.case-lightbox-nav.next{right:10px}
.case-lightbox-nav:disabled{opacity:0;pointer-events:none}
.case-lightbox-meta{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
  z-index:2;transform:translateX(-50%);display:flex;align-items:center;gap:9px;max-width:calc(100% - 120px);
  padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.82);
  font-size:10.5px;line-height:1.4;white-space:nowrap}
.case-lightbox-meta b{font-family:var(--mono);font-size:11px;color:#fff;font-weight:700}
html[data-theme="night"] .case-block.effect{background:rgba(138,106,160,.16);border-left-color:#b69bd0}
html[data-theme="night"] .case-block.effect .case-label{color:#c8b4e5}

/* 右下角模块快捷跳转 */
.quicknav{position:fixed;width:58px;height:58px;z-index:55}
.quicknav:not(.dragging){transition:left .18s ease,right .18s ease,top .18s ease,bottom .18s ease,transform .18s ease}
.quicknav[data-side="left"]{left:max(14px,env(safe-area-inset-left));right:auto}
.quicknav[data-side="right"]{right:max(14px,env(safe-area-inset-right));left:auto}
.quicknav[data-y="top"]{top:max(14px,env(safe-area-inset-top));bottom:auto;transform:none}
.quicknav[data-y="mid"]{top:50%;bottom:auto;transform:translateY(-50%)}
.quicknav[data-y="bottom"]{bottom:max(16px,calc(env(safe-area-inset-bottom) + 12px));top:auto;transform:none}
.quicknav.dragging{transition:none;transform:none!important}
.quicknav[hidden]{display:none}
.quicknav-toggle{position:relative;width:58px;height:58px;display:grid;place-items:center;
  border:0;background:transparent;touch-action:none;cursor:grab}
.quicknav-face{position:relative;width:48px;height:48px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--accent);
  box-shadow:var(--shadow-lift)}
.quicknav.dragging .quicknav-toggle{cursor:grabbing}
.quicknav.dragging .quicknav-face::after{animation-play-state:paused}
.quicknav-face::after{
  content:"";position:absolute;inset:-5px;z-index:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(#37698F,#1f6b52,#B07C28,#8f2f2f,#37698F);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 0 3px rgba(31,107,82,.3));
  animation:quicknavMarquee 3s linear infinite;will-change:transform;
}
.quicknav-face::before{content:"";width:10px;height:10px;border-left:2px solid currentColor;
  border-top:2px solid currentColor;transform:rotate(45deg) translate(2px,2px);transition:transform .16s ease}
.quicknav.open .quicknav-face::before{transform:rotate(225deg) translate(2px,2px)}
.quicknav-panel{position:absolute;display:none;width:min(280px,calc(100vw - 48px));
  max-height:var(--qpanel-max,min(70vh,560px));
  overflow-y:auto;overscroll-behavior:contain;padding:8px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);box-shadow:var(--shadow-lift)}
.quicknav[data-side="right"] .quicknav-panel{right:0;left:auto}
.quicknav[data-side="left"] .quicknav-panel{left:0;right:auto}
.quicknav.panel-up .quicknav-panel{bottom:calc(100% + 10px);top:auto}
.quicknav.panel-down .quicknav-panel{top:calc(100% + 10px);bottom:auto}
.quicknav.open .quicknav-panel{display:block}
.quicknav-tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:3px;margin-bottom:7px;border-radius:9px;background:var(--line2);
  box-shadow:0 5px 8px -7px rgba(35,33,29,.38)}
.quicknav-tabs button{padding:7px 9px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.quicknav-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.quicknav-tabs button:disabled{opacity:.45;cursor:default}
.quickadd-pane[hidden],.quicknav-menu[hidden]{display:none}
.qa-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:3px 3px 8px;font-size:12px;color:var(--ink3)}
.qa-hd b{font-size:13px;color:var(--ink)}
.qa-count{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qa-item{position:relative;min-height:56px;padding:8px 24px 8px 8px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);text-align:left;line-height:1.35}
.qa-item .qa-id{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.qa-item .qa-name{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--ink)}
.qa-item .qa-check{position:absolute;top:6px;right:5px;width:16px;height:16px;display:grid;
  place-items:center;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--ink3)}
.qa-item.on{border-color:var(--accent);background:var(--accent-bg)}
.qa-item.on .qa-check{border-color:var(--accent);background:var(--accent);color:var(--inverse)}
.quicknav-menu{display:grid;gap:3px}
.quicknav-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;
  border:1px solid transparent;border-radius:7px;text-align:left;font-size:13.5px;color:var(--ink);
  background:var(--line2);background:color-mix(in srgb,var(--nav-c) 17%,var(--panel))}
.quicknav-menu button[hidden]{display:none}
.quicknav-menu .qnav-icon{flex:none;width:18px;height:18px;color:var(--nav-c,var(--accent))}
.quicknav-menu button:active{background:color-mix(in srgb,var(--nav-c) 28%,var(--panel))}
@keyframes quicknavMarquee{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .quicknav-face::after{animation:none}
}

footer{border-top:1px solid var(--line);margin-top:26px;padding:16px 0 26px;font-size:11.5px;color:var(--ink3);line-height:1.8}
footer .ver{font-family:var(--mono);margin-top:6px}
.loading{padding:56px 16px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.9}
.loading .spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;margin:0 auto 12px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{padding:34px 18px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.9}
.errbox .retry{margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:7px 18px;
  font-size:13px;color:var(--accent);background:var(--accent-bg)}
.fadein{animation:fadeUp .22s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  .hd{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px 8px;padding:10px 0 8px}
  .hd h1{grid-column:1;grid-row:1}
  .hd .sub{grid-column:2;grid-row:1;margin-left:0}
  .hd-toggle{grid-column:3;grid-row:1;margin-left:0;width:36px;height:36px}
  .hd-tools{grid-column:1/-1;grid-row:2;justify-self:end;gap:8px}
  .hd-tool{width:36px;height:36px}

  .el-grid{grid-template-columns:1fr 1fr;gap:8px}
}
@media (max-width:420px){

  .el-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .el-cell .v{font-size:22px}
}
@media (max-width:350px){
  .hd h1{font-size:15px}
  .hd .sub{font-size:10.5px}
  .zoom-val{min-width:38px}
}
</style>
</head>
<body>

<script>
/* ============================================================
   数据源：国内静态壳 + GitHub 仓库（jsdelivr）
   - preview.html 里 BUNDLE 已被内联，走后门直接读
   - 线上：localStorage 缓存 10 分钟 → GitHub API 取最新 sha → 壳内 BUILD_SHA
   ============================================================ */
var BUNDLE = /*__DATA__*/null;

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function resolveSha(){
  if (BUILD_SHA) return BUILD_SHA;
  var c = lsGet('cf_ver');
  if (c && c.sha && (Date.now()-c.t) < 600000) return c.sha;
  try{
    var r = await fetch('https://api.github.com/repos/'+REPO+'/commits/main', {cache:'no-store'});
    if (r.ok){
      var j = await r.json();
      var sha = (j.sha||'').slice(0,7);
      if (sha){ lsSet('cf_ver', {sha:sha, t:Date.now()}); return sha; }
    }
  }catch(e){}
  return CASE_FALLBACK_SHA || 'main';
}

async function resolveCaseSha(){
  if (BUNDLE) return '';

  if (c && c.sha && (Date.now()-c.t) < 600000) return c.sha;
  try{
    var r = await fetch('https://api.github.com/repos/'+REPO+'/commits/main', {cache:'no-store'});
    if (r.ok){

      if (sha){ lsSet('cf_case_ver', {sha:sha, t:Date.now()}); return sha; }
    }
  }catch(e){}
  return 'main';
}

}

  if (!GING || !DB) return;

    Object.keys(GING[k] || {}).forEach(function(name){
      pool.push({t:name, ids:GING[k][name]});

    var out = [];
    pool.forEach(function(o){ if (o.ids.indexOf(it.id) >= 0) out.push(o.t); });
    it._ings = out;
  });
}

var CLSC = {'维生素':'#B07C28','矿物质':'#37698F','氨基酸':'#3C7A68','脂质':'#8A6AA0',
  '抗氧化':'#9C5B45','B族辅因子':'#6B5E98'};

/* 多产品时给「合计用量」逐产品分色（只影响显示，不动数据）
   按产品 ID 稳定散列取起始色，再依次避重 + 色距过滤（RGB 距离 > 55）：
   看起来是随机多彩，且同一组合内固定，改份数/刷新不跳色；产品超过 12 个才可能重复。 */
var HWC = ['#1f6b52','#B07C28','#37698F','#9C5B45','#6B5E98','#5E7A46',
  '#8A6AA0','#A9734A','#4E7D86','#8C4A3C','#3C7A68','#7E6A3F'];
function hwRGB(hex){
  var n = parseInt(hex.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function hwDist(a,b){
  var x = parseInt(a.slice(1),16), y = parseInt(b.slice(1),16);
  var dr = ((x>>16)&255)-((y>>16)&255), dg = ((x>>8)&255)-((y>>8)&255),
      db = (x&255)-(y&255);
  return Math.sqrt(dr*dr+dg*dg+db*db);
}
function hwColors(list){
  if (list.length < 2) return list.map(function(){ return ''; });
  var used = [];
  return list.map(function(x){
    var id = String(x.p.id||''), h = 0;
    for (var k=0;k<id.length;k++) h = (h*31 + id.charCodeAt(k)) >>> 0;
    var start = h % HWC.length, pick = -1, fallback = -1;
    for (var s=0;s<HWC.length;s++){
      var c = (start+s) % HWC.length, col = HWC[c];
      if (used.indexOf(col) >= 0) continue;
      if (fallback < 0) fallback = c;
      if (used.every(function(u){ return hwDist(col,u) > 55; })){ pick = c; break; }
    }
    if (pick < 0) pick = (fallback < 0 ? start : fallback);
    used.push(HWC[pick]);
    return HWC[pick];
  });
}

   钠 3900~5850 mg、钾 2000~3000 mg、镁 400~600 mg
   钠:钾 的「配平带」按两端比值取 1.5~2.5（目标区间本身的比约 1.3:1 ~ 2.9:1） */

/* ---------------- 工具 ---------------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function fmtNum(v){
  if (v==null || isNaN(v)) return '—';
  var a = Math.abs(v);
  var s;
  if (a >= 1000) s = Math.round(v).toLocaleString('en-US');
  else if (a >= 100) s = v.toFixed(0);
  else if (a >= 10) s = v.toFixed(1);
  else if (a >= 1) s = v.toFixed(2);
  else if (a >= 0.01) s = v.toFixed(3);
  else s = v.toPrecision(2);
  return s.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
}
function unitScale(v,u){
  if (u==='mg' && v!=null && v>0 && v<1) return {v:v*1000, u:'μg'};
  if (u==='g' && v!=null && v<0.1) return {v:v*1000, u:'mg'};
  return {v:v,u:u};
}
function fmtVal(v,u){ var s=unitScale(v,u); return fmtNum(s.v)+' '+s.u; }
/* 统一换算到 mg，用于和目标值比较 */
function toMg(v,u){
  u = String(u||'mg').toLowerCase();
  if (u==='g') return v*1000;
  if (u==='μg'||u==='ug'||u==='mcg') return v/1000;
  return v;
}
function normText(s){ return String(s||'').replace(/<[^>]+>/g,'').replace(/[\s\u3000，。、；：！？,.;:!?*"'“”‘’()（）]/g,''); }
function q(sel){ return document.querySelector(sel); }

var ZOOM_MIN = 0.8, ZOOM_MAX = 1.4, ZOOM_STEP = 0.1;
var contentZoom = 1, themeMode = 'day';
function applyTheme(save){
  var root = document.documentElement;
  var night = themeMode === 'night';
  if (night) root.setAttribute('data-theme', 'night');
  else root.removeAttribute('data-theme');
  var btn = q('#themeToggle'), ico = q('#themeIcon');
  if (btn){
    btn.setAttribute('aria-pressed', String(night));
    btn.setAttribute('aria-label', night ? '切换到白昼模式' : '切换到夜间模式');
    btn.title = night ? '切换到白昼模式' : '切换到夜间模式';
  }
  if (ico) ico.textContent = night ? '☾' : '☀';
  if (save) lsSet('cf_theme', themeMode);
}
function toggleTheme(){
  themeMode = themeMode === 'night' ? 'day' : 'night';
  applyTheme(true);
}
function applyContentZoom(scale, save){
  scale = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, scale || 1)) * 10) / 10;
  contentZoom = scale;
  var main = q('#main');
  if (main){
    main.style.zoom = String(scale);
    main.style.width = '';
  }
  var label = q('#zoomVal'), out = q('#zoomOut'), inc = q('#zoomIn');
  if (label) label.textContent = Math.round(scale * 100) + '%';
  if (out) out.disabled = scale <= ZOOM_MIN;
  if (inc) inc.disabled = scale >= ZOOM_MAX;
  if (save) lsSet('cf_zoom', scale);
}
function initDisplayControls(){
  themeMode = lsGet('cf_theme') === 'night' ? 'night' : 'day';
  applyTheme(false);
  var savedZoom = parseFloat(lsGet('cf_zoom'));
  applyContentZoom(isNaN(savedZoom) ? 1 : savedZoom, false);
}

/* 弹层打开期间固定背景页，详情正文到达上下边界后不再把滚动传给页面。 */
function syncSheetLock(){
  var hasSheet = !!document.querySelector('.sheet.on');
  var locked = document.body.classList.contains('sheet-open');
  if (hasSheet && !locked){
    sheetLocked = true;
    sheetLockY = window.scrollY || 0;
    document.documentElement.classList.add('sheet-open');
    document.body.classList.add('sheet-open');
    document.body.style.top = -sheetLockY + 'px';
  } else if (!hasSheet && locked){
    document.documentElement.classList.remove('sheet-open');
    document.body.classList.remove('sheet-open');
    document.body.style.top = '';
    var restoreY = sheetLockY;
    requestAnimationFrame(function(){
      window.scrollTo(0, restoreY);
      requestAnimationFrame(function(){
        if (Math.abs((window.scrollY || 0) - restoreY) > 2) window.scrollTo(0, restoreY);
        headerLastY = restoreY;
        sheetLocked = false;
      });
    });
  }
}

var GAP_SINGLE = {'钠':'P119', '钾':'P063'};
var GAP_MG_IDS = ['P065','P057','P096'];
var GAP_MG_LABELS = {'P065':'甘氨酸镁', 'P057':'L-苏糖酸镁', 'P096':'柠檬酸镁'};
var gapState = null;
function gapProductAmount(p, element, gapMg){
  var e = (p.elements||[]).find(function(x){ return x.el === element; });
  var perMg = e ? toMg(e.value, e.unit) : 0;
  if (!(perMg > 0)) return null;
  return gapMg / perMg * ((p.basis && p.basis.value) || 1);
}
function closeGapSheet(){
  q('#gapSheet').classList.remove('on');
  syncSheetLock();
}
async function addGapProduct(pid, element, gapMg, replaceMg){
  var p = await product(pid);
  var amount = gapProductAmount(p, element, gapMg);
  if (amount == null) return;
  amount = Math.max(0.01, Math.ceil(amount * 100) / 100);
  if (replaceMg) SEL = SEL.filter(function(x){ return GAP_MG_IDS.indexOf(x.id) < 0; });
  var selected = SEL.find(function(x){ return x.id === pid; });
  if (selected) selected.amount = Math.ceil(((selected.amount || 0) + amount) * 100) / 100;
  else SEL.push({id:pid, amount:amount});
  closeGapSheet();
  renderChips();
  render();
  syncHash();
}
function magnesiumBaseGap(){
  var r = compute(), total = 0;
  var row = Array.from(r.els.values()).find(function(o){ return o.el === '镁'; });
  if (row){
    row.items.forEach(function(i){
      if (GAP_MG_IDS.indexOf(i.pid) < 0) total += toMg(i.v, row.unit);
    });
  }
  return Math.max(0, TY['镁'].low - total);
}
async function openGapSheet(gapMg){
  var baseGap = magnesiumBaseGap();
  if (!(baseGap > 0)) baseGap = gapMg;
  gapState = {element:'镁', gapMg:baseGap};
  q('#gapTitle').textContent = '补镁缺口 · 基础缺口 ' + fmtNum(baseGap) + ' mg';
  q('#gapBody').innerHTML = '<div class="loading" style="padding:28px 10px">正在计算三种产品用量…</div>';
  q('#gapSheet').classList.add('on');
  syncSheetLock();
  try{
    var list = await Promise.all(GAP_MG_IDS.map(function(pid){ return product(pid); }));
    q('#gapBody').innerHTML = list.map(function(p){
      var amount = gapProductAmount(p, '镁', baseGap);
      if (amount == null) return '';
      amount = Math.max(0.01, Math.ceil(amount * 100) / 100);
      var e = p.elements.find(function(x){ return x.el === '镁'; });
      var per = e ? fmtNum(toMg(e.value, e.unit)) + ' mg/份' : '';
      return '<button type="button" class="gap-opt'+(SEL.some(function(s){ return s.id===p.id; })?' on':'')+
        '" data-gap-add="'+p.id+'" aria-label="添加'+esc(GAP_MG_LABELS[p.id]||p.name)+'">'+
        '<span class="tx"><span class="nm">'+esc(GAP_MG_LABELS[p.id]||p.name)+'</span>'+
        '<span class="meta">'+p.id+' · 约需 '+fmtNum(amount)+' '+esc(p.basis.unit)+' · '+per+'</span></span>'+
        '<span class="add" aria-hidden="true">+</span></button>';
    }).join('');
  }catch(e){
    q('#gapBody').innerHTML = '<div class="errbox"><div>产品数据没加载出来</div><button class="retry" onclick="openGapSheet('+gapMg+')">重试</button></div>';
  }
}
function handleGapCard(element, gapMg){
  if (element === '镁'){
    openGapSheet(gapMg);

  }
  var pid = GAP_SINGLE[element];
  if (pid) addGapProduct(pid, element, gapMg, false);

/* 多产品时，向下浏览自动收起顶部选品区；点击标题栏可随时展开。 */
var headerCollapsed = false, headerLastY = 0, headerManualOpenY = 0, headerScrollPauseUntil = 0;
function syncHeaderControl(){
  var hd = q('header'), bar = q('#selbar'), btn = q('#hdToggle');
  if (!hd || !bar || !btn) return;
  var can = SEL.length >= 2;
  hd.classList.toggle('can-collapse', can);
  if (!can) headerCollapsed = false;
  hd.classList.toggle('is-collapsed', can && headerCollapsed);
  btn.setAttribute('aria-expanded', String(!(can && headerCollapsed)));
  btn.setAttribute('aria-label', can && headerCollapsed ? '展开产品选择' : '收起产品选择');
  bar.setAttribute('aria-hidden', String(can && headerCollapsed));
  bar.inert = can && headerCollapsed;
}
function setHeaderCollapsed(collapsed, source){
  if (collapsed && SEL.length < 2) return;
  headerCollapsed = !!collapsed;
  if (!headerCollapsed && source === 'tap'){
    headerManualOpenY = window.scrollY || 0;
    headerScrollPauseUntil = performance.now() + 450;
  }
  syncHeaderControl();
}
window.addEventListener('scroll', function(){
  var y = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
  if (sheetLocked){
    headerLastY = y;
    return;
  }
  if (performance.now() < headerScrollPauseUntil){
    headerLastY = y;
    return;
  }
  if (SEL.length < 2){
    headerLastY = y;
    return;
  }
  if (y <= 4){
    setHeaderCollapsed(false, 'top');
  } else if (!headerCollapsed && y > 64 && y > headerLastY + 2 && y - headerManualOpenY > 42){
    setHeaderCollapsed(true, 'scroll');
  }
  headerLastY = y;
}, {passive:true});

/* 吸顶汇总条：滚动到下面也看得见总量 */
function renderSum(r){
  var box = q('#sumbar');
  if (!box) return;
  if (!r || r.list.length === 0){
    box.style.display = 'none'; box.innerHTML = ''; return;
  }
  var order = ['钠','钾','镁','钙','锌','硒','碘','铁','铜','锰'];
  var arr = Array.from(r.els.values()).sort(function(a,b){
    var ia = order.indexOf(a.el), ib = order.indexOf(b.el);
    return (ia<0?99:ia) - (ib<0?99:ib);
  }).slice(0, 6);
  var html = '<span class="lbl">'+r.list.length+' 样</span>';
  html += arr.map(function(o){
    var s = unitScale(o.total, o.unit);
    return '<span class="si" style="--c:'+elColor(o.el)+'">'+esc(o.el)+
      '<b style="color:'+elColor(o.el)+'">'+fmtNum(s.v)+'</b><i>'+esc(s.u)+'</i></span>';
  }).join('');
  box.innerHTML = html;
  box.style.display = 'flex';
}

/* ---------------- 计算 ---------------- */
function compute(){
  var ing = new Map();     // name|unit -> {name,unit,cls,alias,total,items,noAmt}
  var els = new Map();
  var cls = new Map();
  var unm = [];
  var list = [];

  SEL.forEach(function(s){
    var p = PD[s.id]; if (!p) return;
    var basis = (p.basis && p.basis.value) || 1;
    var f = (s.amount==null? basis : s.amount) / basis;
    list.push({p:p, amount:s.amount, factor:f});

    (p.ingredients||[]).forEach(function(g2){
      var pot = g2.potency && g2.potency.value != null ? g2.potency : null;
      var value = pot ? pot.value : g2.amount;
      var unit = pot && pot.unit ? pot.unit : g2.unit;
      var key = (g2.name||'')+'|'+(unit||'');
      if (!ing.has(key)) ing.set(key, {name:g2.name, unit:unit, cls:g2.cls||'其他', alias:g2.alias, total:0, items:[], noAmt:false, potency:!!pot, approx:false});
      var o = ing.get(key);
      if (!o.alias && g2.alias) o.alias = g2.alias;
      if (pot && /参考页/.test(pot.status || '')) o.approx = true;
      if (value==null){ o.noAmt = true; unm.push({pid:p.id, name:g2.name}); }
      else {
        var v = value * f;
        o.total += v;
        o.items.push({
          pid:p.id, pname:p.name, v:v,
          rawValue: pot ? (pot.rawValue==null ? null : pot.rawValue*f) : null,
          rawUnit: pot ? pot.rawUnit : '',
          potency: !!pot
        });
      }
    });
    (p.elements||[]).forEach(function(e){
      var key = (e.el||'')+'|'+(e.unit||'');
      if (!els.has(key)) els.set(key, {el:e.el, unit:e.unit, total:0, items:[], status:e.status});
      var o = els.get(key);
      var v = e.value * f;
      o.total += v;
      o.items.push({pid:p.id, pname:p.name, v:v});
    });
    (p.ingredients||[]).forEach(function(g2){
      if (!g2.cls) return;
      if (!cls.has(g2.cls)) cls.set(g2.cls, new Set());
      cls.get(g2.cls).add(p.id);
    });
  });

  return {ing:ing, els:els, cls:cls, unm:unm, list:list};
}

var AI_YUANBAO_URL = 'https://yuanbao.tencent.com/';
var AI_COMBO_SUFFIX = '请详细评价一下，这些营养素一起补充有什么功能和作用？请从正分子医学、功能医学、生理分子调节机制的角度，对其功能和作用进行系统分析。';
var aiDefaultPrompt = '';

function uniqueIngredientNames(items){
  var seen = {}, out = [];
  (items||[]).forEach(function(g){
    var key = g.name||'';
    if (!g.name || seen[key]) return;
    seen[key] = 1;
    out.push({name:g.name, alias:g.alias||''});
  });
  return out;
}

function firstEnglishAlias(alias){
  var found = '';
  String(alias||'').split('/').some(function(part){
    part = part.trim();
    if (/[A-Za-z]/.test(part)){ found = part; return true; }
    return false;
  });
  return found;
}
function singleIngredientQuestion(g){
  var en = firstEnglishAlias(g.alias);
  var label = '【' + g.name + (en ? ' · ' + en : '') + '】';
  return '请详细评价一下，' + label +
    '有什么功能和作用？请从正分子医学、功能医学、生理分子调节机制的角度，对其功能和作用进行系统分析。';
}
function buildProductAIPrompt(p){
  var rows = uniqueIngredientNames(p.ingredients);
  var single = rows.length === 1;
  var selected = SEL.find(function(x){ return x.id===p.id; });
  var amount = selected ? selected.amount : p.defaultAmount;
  var lines = [];
  if (!single) lines.push('请从功能医学、生理分子机制和营养素配伍角度，科普以下产品。', '');
  lines.push(
    '产品：' + p.name,
    '规格：' + (p.spec || '—'),
    '计量基准：' + ((p.basis && p.basis.raw) || '—'),
    '当前每日份数：' + fmtNum(amount) + ' ' + ((p.basis && p.basis.unit) || '份'),
    '',
    '成分清单（仅列成分名称）：'
  );
  rows.forEach(function(g,i){
    lines.push((i+1) + '. ' + g.name);
  });
  lines.push('', single ? singleIngredientQuestion(rows[0]) : AI_COMBO_SUFFIX);
  return lines.join('\n');
}

function buildComboAIPrompt(){
  var r = compute();
  var rows = Array.from(r.ing.values()).filter(function(o){ return o.total > 0; });
  rows.sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||''),'zh-CN'); });
  var lines = ['合计后的成分清单（仅列成分名称）：'];
  rows.forEach(function(o,i){
    lines.push((i+1) + '. ' + o.name);
  });
  lines.push('', AI_COMBO_SUFFIX);
  return lines.join('\n');
}

function caseMeta(pid){
  return CASE_INDEX && CASE_INDEX.products && CASE_INDEX.products[pid] || null;
}

function shopMeta(pid){
  return SHOP_INDEX && SHOP_INDEX.products && SHOP_INDEX.products[pid] || null;
}

function safeShopUrl(value){
  var url = String(value || '');
  try{
    var parsed = new URL(url);
    return /^https?:$/.test(parsed.protocol) ? parsed.href : '';
  }catch(e){
    return '';
  }
}

async function ensureShopIndex(){
  if (SHOP_INDEX_READY) return SHOP_INDEX;
  if (SHOP_INDEX_BUSY) return SHOP_INDEX_BUSY;
  SHOP_INDEX_BUSY = (async function(){
    try{
      if (BUNDLE && BUNDLE.shop){
        SHOP_INDEX = BUNDLE.shop;
      }else{
        var sha = await resolveCaseSha();
        SHOP_BASE = 'https://fastly.jsdelivr.net/gh/'+REPO+'@'+sha+'/data';
        var res = await fetch(SHOP_BASE+'/shop.json', {cache:'no-store'});
        if (!res.ok) throw new Error('shop '+res.status);
        SHOP_INDEX = await res.json();
      }
    }catch(e){
      SHOP_INDEX = {products:{}};
    }finally{
      SHOP_INDEX_READY = true;
      SHOP_INDEX_BUSY = null;
    }
    return SHOP_INDEX;
  })();
  return SHOP_INDEX_BUSY;
}

async function ensureCaseIndex(){
  if (CASE_INDEX_READY) return CASE_INDEX;
  if (CASE_INDEX_BUSY) return CASE_INDEX_BUSY;
  CASE_INDEX_BUSY = (async function(){
    try{
      if (BUNDLE && BUNDLE.cases && BUNDLE.cases.index){
        CASE_INDEX = BUNDLE.cases.index;
      }else{
        var sha = await resolveCaseSha();
        CASE_BASE = 'https://fastly.jsdelivr.net/gh/'+REPO+'@'+sha+'/data/cases';
        var res = await fetch(CASE_BASE+'/index.json', {cache:'no-store'});
        if (!res.ok) throw new Error('case index '+res.status);
        CASE_INDEX = await res.json();
      }
    }catch(e){
      CASE_INDEX = {products:{}};
    }finally{
      CASE_INDEX_READY = true;
      CASE_INDEX_BUSY = null;
    }
    return CASE_INDEX;
  })();
  return CASE_INDEX_BUSY;
}

async function loadCaseFile(pid){
  if (CASE_CACHE[pid]) return CASE_CACHE[pid];
  if (!CASE_INDEX_READY) await ensureCaseIndex();
  var meta = caseMeta(pid);
  if (!meta) return null;
  if (BUNDLE && BUNDLE.cases && BUNDLE.cases.products){
    var bundled = BUNDLE.cases.products[pid] || null;
    if (bundled) CASE_CACHE[pid] = bundled;
    return bundled;
  }
  if (CASE_BUSY[pid]) return CASE_BUSY[pid];
  CASE_BUSY[pid] = fetch(CASE_BASE+'/'+encodeURIComponent(meta.file), {cache:'force-cache'})
    .then(function(res){
      if (!res.ok) throw new Error('case file '+res.status);
      return res.json();
    })
    .then(function(data){
      if (!data || !Array.isArray(data.items)) throw new Error('case file malformed');
      CASE_CACHE[pid] = data;
      delete CASE_BUSY[pid];
      return data;
    })
    .catch(function(err){
      delete CASE_BUSY[pid];
      throw err;
    });
  return CASE_BUSY[pid];
}

function safeCaseImageUrl(value){
  var url = String(value || '');
  try{
    var parsed = new URL(url, location.href);
    if (parsed.protocol !== 'https:') return '';
    if (parsed.hostname.endsWith('jsdelivr.net')) parsed.hostname = 'gcore.jsdelivr.net';
    return parsed.href;
  }catch(e){
    return '';
  }
}

function caseImageFallbackUrl(value){
  var url = safeCaseImageUrl(value);
  if (!url) return '';
  try{
    var parsed = new URL(url);
    if (parsed.hostname === 'gcore.jsdelivr.net') parsed.hostname = 'cdn.jsdelivr.net';
    else if (parsed.hostname === 'cdn.jsdelivr.net' || parsed.hostname === 'fastly.jsdelivr.net') parsed.hostname = 'gcore.jsdelivr.net';
    else return '';
    return parsed.href;
  }catch(e){
    return '';
  }
}

function retryCaseImageUrl(value){
  var url = safeCaseImageUrl(value);
  if (!url) return '';
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'case_retry=' + Date.now();
}

function markCaseImageFailed(img){
  img.dataset.caseFailed = '1';
  delete img.dataset.caseTimer;
  if (img.id === 'caseLightboxImg'){
    img.hidden = true;
    q('#caseLightboxHint').textContent = '图片加载失败，请关闭后重试';
    return;
  }
  var item = img.closest('.case-img-item');
  if (!item) return;
  img.hidden = true;
  var retry = item.querySelector('.case-img-retry');
  if (retry) retry.hidden = false;
}

function handleCaseImageError(img){
  var fallback = img.dataset.caseFallback || '';
  if (fallback && img.dataset.caseStage !== 'fallback'){
    img.dataset.caseStage = 'fallback';
    img.dataset.caseFailed = '';
    img.hidden = false;
    img.src = fallback;
    armCaseImageTimeout(img);
    return;
  }
  markCaseImageFailed(img);
}

function armCaseImageTimeout(img){
  if (!img || img.dataset.caseFailed === '1') return;
  var token = String(Date.now()) + Math.random();
  img.dataset.caseTimer = token;
  setTimeout(function(){
    if (img.dataset.caseTimer !== token || img.dataset.caseFailed === '1') return;
    if (img.naturalWidth > 0) return;
    var fallback = img.dataset.caseFallback || '';
    if (fallback && img.dataset.caseStage !== 'fallback'){
      img.dataset.caseStage = 'fallback';
      img.hidden = false;
      img.src = fallback;
      armCaseImageTimeout(img);
    }else{
      markCaseImageFailed(img);
    }
  }, 5000);
}

function watchCaseImages(root){
  (root || document).querySelectorAll('.case-imgs img').forEach(armCaseImageTimeout);
}

function caseBucket(item){
  if (item.type === 'discussion') return 'discussion';
  return item.status === '明显改善' ? 'good' : 'other';
}

function caseSortValue(item){
  var match = String(item.id || '').match(/\d+/g);
  return match && match.length ? Number(match[match.length - 1]) : 0;
}

function filteredCaseItems(){
  var items = caseView && caseView.data && caseView.data.items || [];
  if (caseView && caseView.filter && caseView.filter !== 'all'){
    items = items.filter(function(item){ return caseBucket(item) === caseView.filter; });
  }
  items = items.slice();
  var latest = !caseView || caseView.sort !== 'earliest';
  items.sort(function(a, b){
    var diff = caseSortValue(a) - caseSortValue(b);
    if (!diff) diff = String(a.id || '').localeCompare(String(b.id || ''), 'zh-CN');
    return latest ? -diff : diff;
  });
  return items;
}

function renderCaseSort(){
  if (!caseView || !caseView.data){
    q('#caseSort').hidden = true;
    return;
  }
  q('#caseSort').hidden = false;
  q('#caseSort').querySelectorAll('[data-case-sort]').forEach(function(button){
    button.classList.toggle('on', button.dataset.caseSort === caseView.sort);
  });
}

function applyCaseFontSize(persist){
  q('#caseSheet').classList.toggle('case-large', caseFontLarge);
  q('#caseZoomToggle').textContent = caseFontLarge ? 'A−' : 'A+';
  q('#caseZoomToggle').setAttribute('aria-label', caseFontLarge ? '缩小案例文字' : '放大案例文字');
  if (persist) lsSet('cf_case_large', caseFontLarge);
}

function renderCaseFilters(){
  if (!caseView || !caseView.data){
    q('#caseFilters').hidden = true;
    q('#caseSort').hidden = true;
    return;
  }
  var all = caseView.data.items || [];
  var counts = {all:all.length, good:0, other:0, discussion:0};
  all.forEach(function(item){ counts[caseBucket(item)]++; });
  var defs = [
    {id:'all', label:'全部'},
    {id:'good', label:'明显改善'},
    {id:'other', label:'其他案例'},
    {id:'discussion', label:'讨论'}
  ];
  q('#caseFilters').innerHTML = defs.map(function(def){
    return '<button type="button" class="case-filter'+(caseView.filter === def.id ? ' on' : '')+
      '" data-case-filter="'+def.id+'">'+def.label+'<b>'+counts[def.id]+'</b></button>';
  }).join('');
  q('#caseFilters').hidden = false;
  renderCaseSort();
}

function renderCaseList(){
  if (!caseView || !caseView.data) return;
  var items = filteredCaseItems();
  var shown = Math.min(caseView.shown, items.length);
  var body = items.slice(0, shown).map(function(item, itemIndex){
    var bucket = caseBucket(item);
    var status = bucket === 'discussion' ? '讨论' : (item.status || '未标结果');
    var badgeClass = bucket === 'discussion' ? 'disc' : (bucket === 'good' ? 'good' : 'mid');
    var problems = (item.problem || []).map(function(name){
      return '<span>' + esc(name) + '</span>';
    }).join('');
    var supplements = (item.supplement || []).map(function(name){
      return '<span>' + esc(name) + '</span>';
    }).join('');
    var images = (item.images || []).map(function(url){
      var safe = safeCaseImageUrl(url);
      if (!safe) return '';
      var fallback = caseImageFallbackUrl(safe);
      return '<div class="case-img-item">' +
        '<img loading="' + (itemIndex < 5 ? 'eager' : 'lazy') + '" decoding="async" src="' + escAttr(safe) +
        '" data-case-img="' + escAttr(safe) + '" data-case-primary="' + escAttr(safe) +
        '" data-case-fallback="' + escAttr(fallback) + '" data-case-stage="primary" alt="案例截图">' +
        '<button type="button" class="case-img-retry" data-case-img-retry hidden>图片加载失败，点击重试</button>' +
        '</div>';
    }).filter(Boolean);
    var summary = item.summary && item.summary !== item.effect
      ? '<div class="case-story">「' + esc(item.summary) + '」</div>' : '';
    return '<article class="case-item">' +
      '<div class="case-head"><span class="case-user">' + esc(item.user || '群友') + '</span>' +
      '<span class="case-id">' + esc(item.id || '') + '</span>' +
      '<span class="case-badge ' + badgeClass + '">' + esc(status) + '</span></div>' +
      (problems ? '<div class="case-problem"><b>相关症状</b>' + problems + '</div>' : '') +
      (supplements ? '<div class="case-block supp"><span class="case-label">补剂方案</span>' +
        '<div class="case-supp">' + supplements + '</div></div>' : '') +
      (item.effect ? '<div class="case-block effect"><span class="case-label">效果</span>' +
        '<div class="case-effect">' + esc(item.effect) + '</div></div>' : '') +
      summary +
      (images.length ? '<div class="case-gallery"><div class="case-imgs">' +
        images.join('') + '</div></div>' : '') +
      '</article>';
  }).join('');
  if (!body) body = '<div class="case-empty">这个筛选下暂无案例</div>';
  var more = shown < items.length
    ? '<button type="button" class="case-more" data-case-more>已显示 ' + shown + ' / ' + items.length +
      ' 条 · 继续查看</button>'
    : '';
  var caseBody = q('#caseBody');
  var previousScroll = caseBody.scrollTop;
  caseBody.innerHTML = body + more;
  caseBody.scrollTop = previousScroll;
  watchCaseImages(caseBody);
}

function caseGalleryResetTransform(){
  caseGallery.scale = 1;
  caseGallery.x = 0;
  caseGallery.y = 0;
  caseGalleryApplyTransform();
}

function caseGalleryClampPan(){
  var stage = q('#caseLightboxStage');
  var maxX = Math.max(0, stage.clientWidth * (caseGallery.scale - 1) / 2);
  var maxY = Math.max(0, stage.clientHeight * (caseGallery.scale - 1) / 2);
  caseGallery.x = Math.max(-maxX, Math.min(maxX, caseGallery.x));
  caseGallery.y = Math.max(-maxY, Math.min(maxY, caseGallery.y));
}

function caseGalleryApplyTransform(){
  caseGalleryClampPan();
  q('#caseLightboxImg').style.transform = 'translate3d(' + caseGallery.x + 'px,' +
    caseGallery.y + 'px,0) scale(' + caseGallery.scale + ')';
}

function caseGallerySetIndex(index){
  var total = caseGallery.images.length;
  if (!total) return;
  caseGallery.index = (index + total) % total;
  var primary = caseGallery.images[caseGallery.index];
  var lightboxImg = q('#caseLightboxImg');
  lightboxImg.hidden = false;
  lightboxImg.dataset.casePrimary = primary;
  lightboxImg.dataset.caseFallback = caseImageFallbackUrl(primary);
  lightboxImg.dataset.caseStage = 'primary';
  lightboxImg.dataset.caseFailed = '';
  lightboxImg.src = primary;
  q('#caseLightboxCount').textContent = (caseGallery.index + 1) + ' / ' + total;
  q('#caseLightboxHint').textContent = '双指缩放 · 左右滑动切换';
  q('#casePrev').disabled = total < 2;
  q('#caseNext').disabled = total < 2;
  caseGallery.pointers.clear();
  caseGallery.single = null;
  caseGallery.pinch = null;
  caseGalleryResetTransform();
  armCaseImageTimeout(lightboxImg);
}

function caseGalleryStep(delta){
  if (caseGallery.images.length < 2) return;
  caseGallerySetIndex(caseGallery.index + delta);
}

function openCaseLightbox(url, imageEl){
  var safe = safeCaseImageUrl(url);
  if (!safe) return;
  var card = imageEl && imageEl.closest ? imageEl.closest('.case-item') : null;
  var urls = card ? Array.from(card.querySelectorAll('.case-imgs img')).map(function(img){
    return safeCaseImageUrl(img.dataset.caseImg || img.src);
  }).filter(Boolean) : [];
  urls = urls.filter(function(item, index){ return urls.indexOf(item) === index; });
  if (!urls.length) urls = [safe];
  var index = urls.indexOf(safe);
  caseGallery.images = urls;
  q('#caseLightbox').classList.add('on');
  caseGallerySetIndex(index < 0 ? 0 : index);
}

function closeCaseLightbox(){
  caseGallery.pointers.clear();
  caseGallery.single = null;
  caseGallery.pinch = null;
  q('#caseLightboxImg').style.transform = '';
  q('#caseLightbox').classList.remove('on');
  q('#caseLightboxImg').removeAttribute('src');
}

function caseGalleryDistance(a, b){
  var dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function caseGalleryMidpoint(a, b){
  return {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2};
}

function caseGalleryPointerDown(e){
  if (!q('#caseLightbox').classList.contains('on')) return;
  e.preventDefault();
  caseGallery.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try{ q('#caseLightboxStage').setPointerCapture(e.pointerId); }catch(err){}
  var points = Array.from(caseGallery.pointers.values());
  if (points.length === 1){
    caseGallery.single = {
      id:e.pointerId, startX:points[0].x, startY:points[0].y,
      startTx:caseGallery.x, startTy:caseGallery.y, dx:0, dy:0
    };
    caseGallery.pinch = null;
  }else if (points.length === 2){
    var mid = caseGalleryMidpoint(points[0], points[1]);
    caseGallery.pinch = {
      distance:caseGalleryDistance(points[0], points[1]),
      midX:mid.x, midY:mid.y,
      startScale:caseGallery.scale, startX:caseGallery.x, startY:caseGallery.y
    };
    caseGallery.single = null;
  }
}

function caseGalleryPointerMove(e){
  if (!caseGallery.pointers.has(e.pointerId)) return;
  e.preventDefault();
  caseGallery.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  var points = Array.from(caseGallery.pointers.values());
  if (points.length >= 2 && caseGallery.pinch){
    var distance = caseGalleryDistance(points[0], points[1]);
    var mid = caseGalleryMidpoint(points[0], points[1]);
    var scale = caseGallery.pinch.startScale * distance / Math.max(1, caseGallery.pinch.distance);
    caseGallery.scale = Math.max(1, Math.min(4, scale));
    caseGallery.x = caseGallery.pinch.startX + (mid.x - caseGallery.pinch.midX);
    caseGallery.y = caseGallery.pinch.startY + (mid.y - caseGallery.pinch.midY);
    caseGalleryApplyTransform();
  }else if (points.length === 1 && caseGallery.single){
    var dx = points[0].x - caseGallery.single.startX;
    var dy = points[0].y - caseGallery.single.startY;
    caseGallery.single.dx = dx;
    caseGallery.single.dy = dy;
    if (caseGallery.scale > 1.01){
      caseGallery.x = caseGallery.single.startTx + dx;
      caseGallery.y = caseGallery.single.startTy + dy;
      caseGalleryApplyTransform();
    }
  }
}

function caseGalleryPointerUp(e, cancelled){
  if (!caseGallery.pointers.has(e.pointerId)) return;
  caseGallery.pointers.delete(e.pointerId);
  try{ q('#caseLightboxStage').releasePointerCapture(e.pointerId); }catch(err){}
  if (!caseGallery.pointers.size){
    var moved = caseGallery.single;
    if (!cancelled && caseGallery.scale <= 1.01 && moved &&
        Math.abs(moved.dx) > 55 && Math.abs(moved.dx) > Math.abs(moved.dy) * 1.2){
      caseGalleryStep(moved.dx < 0 ? 1 : -1);
    }else if (caseGallery.scale <= 1.01){
      caseGalleryResetTransform();
    }
    caseGallery.single = null;
    caseGallery.pinch = null;
  }else if (caseGallery.pointers.size === 1){
    var point = Array.from(caseGallery.pointers.values())[0];
    caseGallery.single = {
      id:e.pointerId, startX:point.x, startY:point.y,
      startTx:caseGallery.x, startTy:caseGallery.y, dx:0, dy:0
    };
    caseGallery.pinch = null;
  }
}

function copyTextSync(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-9999px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
