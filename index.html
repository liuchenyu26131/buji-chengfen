/* 电解质平衡：钠钾镁三条目标带 + 钠钾比 */
function elecHTML(r){
  if (!r || !r.els.size) return '';
  var got = {};
  r.els.forEach(function(o){
    if (!TY[o.el]) return;
    if (!got[o.el]) got[o.el] = {mg:0, pids:[]};
    got[o.el].mg += toMg(o.total, o.unit);
    o.items.forEach(function(i){ if (got[o.el].pids.indexOf(i.pid)<0) got[o.el].pids.push(i.pid); });
  });
  if (!EC_ORDER.some(function(e){ return got[e]; })) return '';

  var rows = EC_ORDER.map(function(el){
    var ty = TY[el], c = elColor(el), g = got[el], mg = g ? g.mg : 0;
    var st, tag, right;
    if (!g)                     { st = 'na';   tag = '所选产品不含'; right = '—'; }
    else if (mg < ty.low)       { st = 'low';  tag = '缺 ' + fmtNum(ty.low - mg); right = g.pids.length + ' 个产品'; }
    else if (mg > ty.high)      { st = 'high'; tag = '超 ' + fmtNum(mg - ty.high); right = g.pids.length + ' 个产品'; }
    else                        { st = 'ok';   tag = '区间内'; right = g.pids.length + ' 个产品'; }

    var pct = g ? Math.min(mg / ty.high * 100, 100) : 0;
    var zl  = ty.low / ty.high * 100;
    return '<div class="ec-row st-'+st+'" style="--c:'+c+'">'+
      '<div class="ec-top">'+
        '<span class="ec-nm"><i></i><span class="ec-cn">'+esc(el)+'</span><em>'+esc(ELS[el]||'')+'</em></span>'+
        '<span class="ec-val">'+(g?fmtNum(mg):'<span style="color:var(--ink3)">0</span>')+'<small>mg</small></span>'+
        '<span class="ec-tag '+st+'">'+esc(tag)+'</span>'+
      '</div>'+
      '<div class="ec-bar">'+
        '<span class="ec-zone" style="left:'+zl.toFixed(1)+'%;right:0"></span>'+
        '<span class="ec-mark" style="left:'+zl.toFixed(1)+'%"></span>'+
        '<span class="ec-fill" style="width:'+pct.toFixed(1)+'%"></span>'+
      '</div>'+
      '<div class="ec-foot"><span>目标 '+fmtNum(ty.low)+' ~ '+fmtNum(ty.high)+' mg</span>'+
      '<span class="gk">'+esc(right)+'</span></div>'+
    '</div>';
  }).join('');

  /* 钠 : 钾 */
  var na = got['钠'] ? got['钠'].mg : 0, k = got['钾'] ? got['钾'].mg : 0;
  var ratioLine = '';
  if (na > 0 && k > 0){
    var rt = na / k, ok = rt >= RATIO_BAND[0] && rt <= RATIO_BAND[1];
    var r1 = function(v){ return String(Math.round(v*10)/10); };
    var txt = rt >= 1 ? r1(rt) + ' : 1' : '1 : ' + r1(1/rt);
    var lab = ok ? '配平' : (rt < RATIO_BAND[0] ? '钾相对偏高' : '钾相对不足');
    ratioLine = '<div class="ec-ratio"><span>钠 : 钾</span><b>'+txt+'</b>'+
      '<span style="font-size:11.5px;color:var(--ink3)">参考 2 : 1（盐 10~15 g 配柠檬酸钾约 5 g）</span>'+
      '<span class="rk '+(ok?'ok':'off')+'">'+lab+'</span></div>';
  } else if (na > 0 || k > 0){
    ratioLine = '<div class="ec-ratio"><span>钠 : 钾</span>'+
      '<span style="font-size:11.5px;color:var(--ink3)">只含'+(na>0?'钠':'钾')+'，不比比值</span></div>';
  }

  /* 缺口折算成原料（系数见 SUP_RATE，来源：钠钾镁平衡统计） */
  var sug = EC_ORDER.map(function(el){
    var ty = TY[el], g = got[el], mg = g ? g.mg : 0;
    if (mg >= ty.low) return '';   /* 完全不含时也照算：缺口就是整个下限 */
    var r = SUP_RATE[el];
    var gapMg = ty.low - mg;
    var gram = gapMg / r.per;
    if (!(gram > 0)) return '';
    var num = gram < 1 ? gram.toFixed(2) : gram.toFixed(1);
    var pick = el === '镁' ? '3 种可选' : (el === '钠' ? 'P119 盐胶囊' : 'P063 柠檬酸钾');
    return '<button type="button" class="ec-sug-i" style="--c:'+elColor(el)+'" data-gap-el="'+esc(el)+
      '" data-gap-mg="'+gapMg.toFixed(4)+'" aria-label="添加'+esc(r.name)+'补充产品">'+
      '<div class="n">'+esc(r.name)+'</div>'+
      '<div class="v"><b>'+num+'</b><span>g</span></div>'+
      '<span class="pick">'+esc(pick)+'</span><span class="plus" aria-hidden="true">+</span>'+
    '</button>';
  }).filter(Boolean).join('');
  var sugLine = sug ? '<div class="ec-sug"><span class="lb">缺口折算 · 补到目标下限约需</span>'+
    '<div class="ec-sug-list">'+sug+'</div>'+
    '<span class="ec-note">按原料含量估算到下限，不是服用建议；补钾需结合自身情况</span></div>' : '';

  return '<section id="elec"><div class="sect-head"><h2>电解质平衡 · 钠 钾 镁</h2>'+
    '<span class="hint">对照目标区间看缺口</span></div>'+
    '<div class="card elec">'+rows+ratioLine+sugLine+'</div>'+
    '<div style="font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.6">'+
      '目标区间取自低碳/生酮口径：钠按每日盐 10~15 g 折算、钾 2~3 g、镁 0.4~0.6 g；'+
      '作息与饮食模式不同时按自己的实际情况看，一般饮食人群的钠参考值更低。'+
    '</div></section>';
}

function ingHTML(r){
  var arr = [];
  r.ing.forEach(function(o){ if (o.total > 0) arr.push(o); });
  if (!arr.length) return '';
  var productColors = {};
  hwColors(r.list).forEach(function(col, i){
    productColors[r.list[i].p.id] = col || '#1f6b52';
  });

  var order = ['维生素','矿物质','氨基酸','脂质','抗氧化','B族辅因子','代谢','甲基化','有机硫','抗糖基化','辅酶','功能性脂质','甜味剂','辅料'];
  function major(o){ return (o.cls||'其他').split('/')[0].trim(); }
  function rank(o){ var i = order.indexOf(major(o)); return i<0?99:i; }

  var cnt = {};
  arr.forEach(function(o){ var m = major(o); cnt[m] = (cnt[m]||0)+1; });
  var cats = Object.keys(cnt).filter(function(m){ return cnt[m] >= 2; })
    .sort(function(a,b){ return cnt[b]-cnt[a]; }).slice(0,8);
  cats = ['全部'].concat(cats);

  var list = arr.filter(function(o){ return INGF==='全部' || major(o)===INGF; });
  list.sort(function(a,b){ return rank(a)-rank(b) || b.total-a.total; });

  var chips = cats.map(function(c){
    return '<button data-ingf="'+esc(c)+'" class="'+(INGF===c?'on':'')+'">'+esc(c)+'</button>';
  }).join('');

  var rows = list.map(function(o, i){
    var no = (i + 1) < 10 ? '0' + (i + 1) : String(i + 1);
    var ids = {}; o.items.forEach(function(i){ ids[i.pid]=1; });

      split = o.items.map(function(i){
        var tip = i.pname + (i.potency && i.rawValue != null && i.rawUnit && i.rawUnit !== o.unit
          ? ' · 原料量 ' + fmtVal(i.rawValue, i.rawUnit) : '');

          '<span title="'+escAttr(tip)+'">'+esc(i.pname.split('·')[0].slice(0,7))+' '+fmtNum(i.v)+'</span></span>';
      }).join('');
    }
    var rawNote = '';
    if (o.potency && n === 1 && o.items[0] && o.items[0].rawValue != null &&
        o.items[0].rawUnit && o.items[0].rawUnit !== o.unit){
      rawNote = '<span class="raw-note">原料量 '+fmtVal(o.items[0].rawValue, o.items[0].rawUnit)+'</span>';
    }
    return '<div class="row"><span class="no">'+no+'</span><div class="nm" style="--c:'+clsColor(o.cls)+'">'+
      '<span class="cls">'+esc(o.cls)+'</span><span class="ing-name">'+esc(o.name)+'</span>'+
      (o.alias?'<span class="al">'+esc(o.alias)+'</span>':'')+

      (split?'<div class="split">'+split+'</div>':'')+
      '</div><div class="val">'+(o.approx?'约 ':'')+fmtVal(o.total, o.unit)+'</div></div>';
  }).join('');

  return '<section id="ingredients"><div class="sect-head"><h2>成分合计（按每日用量）</h2>'+
    '<span class="hint">'+list.length+' 项 · 维A/D3按IU · 不同形态不合并</span></div>'+
    '<div class="ai-combo-row">'+
      '<button type="button" class="ai-btn strong" data-ai-combo aria-label="用 AI 科普当前组合的成分">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8L4 10.7l6.1 1.9L12 18.4l1.9-5.8 6.1-1.9-6.1-1.9L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 17v4"/><path d="M17 19h4"/></svg>'+
        'AI 功用科普 · 本组合'+
      '</button></div>'+
    '<div class="fchips">'+chips+'</div>'+

function notesHTML(r){

    '<div class="txt">还有 '+(arr.length-40)+' 条，见各产品详情</div></div>' : '';

var quickNavTab = lsGet('cf_quick_tab') === 'jump' ? 'jump' : 'add';
var QUICK_ANCHORS = ['tl','ml','bl','tr','mr','br'];
var savedQuickAnchor = lsGet('cf_quicknav_anchor');
var quickNavAnchor = QUICK_ANCHORS.indexOf(savedQuickAnchor) >= 0 ? savedQuickAnchor : 'br';
var quickDrag = null, quickSuppressClickUntil = 0;
function syncQuickPanelLayout(){
  var nav = q('#quicknav');
  if (!nav || nav.hidden) return;
  var r = nav.getBoundingClientRect();
  var gap = 22;
  var up = Math.max(0, r.top - gap);
  var down = Math.max(0, window.innerHeight - r.bottom - gap);
  var row = nav.dataset.y;
  var openDown = row === 'top' || (row !== 'bottom' && down > up);
  var room = openDown ? down : up;
  var maxH = Math.max(180, Math.min(560, window.innerHeight * 0.7, room || 180));
  nav.classList.toggle('panel-down', openDown);
  nav.classList.toggle('panel-up', !openDown);
  nav.style.setProperty('--qpanel-max', maxH + 'px');
}
function applyQuickNavAnchor(anchor, save){
  if (QUICK_ANCHORS.indexOf(anchor) < 0) anchor = 'br';
  var nav = q('#quicknav');
  if (!nav) return;
  quickNavAnchor = anchor;
  nav.dataset.side = anchor.charAt(1) === 'l' ? 'left' : 'right';
  nav.dataset.y = anchor.charAt(0) === 't' ? 'top' : (anchor.charAt(0) === 'b' ? 'bottom' : 'mid');
  nav.style.left = '';
  nav.style.right = '';
  nav.style.top = '';
  nav.style.bottom = '';
  nav.style.transform = '';
  nav.classList.remove('dragging');
  syncQuickPanelLayout();
  if (save) lsSet('cf_quicknav_anchor', anchor);
}
function quickDragPosition(clientX, clientY){
  var nav = q('#quicknav');
  if (!nav || !quickDrag) return;
  var margin = 14;
  var size = nav.offsetWidth || 58;
  var left = Math.max(margin, Math.min(window.innerWidth - size - margin, clientX - quickDrag.offsetX));
  var top = Math.max(margin, Math.min(window.innerHeight - size - margin, clientY - quickDrag.offsetY));
  nav.style.left = left + 'px';
  nav.style.top = top + 'px';
  nav.style.right = 'auto';
  nav.style.bottom = 'auto';
  nav.style.transform = 'none';
  quickDrag.left = left;
  quickDrag.top = top;
}
function nearestQuickAnchor(left, top){
  var size = q('#quicknav').offsetWidth || 58;
  var cx = left + size / 2, cy = top + size / 2;
  var side = cx < window.innerWidth / 2 ? 'l' : 'r';
  var row = cy < window.innerHeight / 3 ? 't' : (cy > window.innerHeight * 2 / 3 ? 'b' : 'm');
  return row + side;
}
function finishQuickDrag(cancel){
  var nav = q('#quicknav');
  if (!nav || !quickDrag) return;
  if (quickDrag.moved){
    var next = cancel ? quickNavAnchor : nearestQuickAnchor(quickDrag.left, quickDrag.top);
    quickSuppressClickUntil = performance.now() + 120;
    applyQuickNavAnchor(next, !cancel);
  }
  quickDrag = null;
  nav.classList.remove('dragging');
}

/* 搜索只匹配「结果行里看得见的字段」+ 成分名。
   一句话口诀是用法摘要，不参与匹配——否则搜「基础」会把「基础 2 粒」的产品全带出来。 */
function renderList(){
  var kw = q('#psearch').value.trim().toLowerCase();
  var base = DB.index.filter(function(it){
    if (FILTER === '多成分' && it.type.indexOf('多成分') < 0) return false;
    if (FILTER === '单成分' && it.type.indexOf('单成分') < 0) return false;
    if (FILTER === '粉末' && !/粉|原料/.test(it.name + it.spec)) return false;
    if (FILTER === '胶囊' && !/胶囊/.test(it.name)) return false;
    return true;
  });

  var html = '', nMain = 0, nIng = 0;

  if (!kw){
    var byGroup = new Map();
    base.forEach(function(it){
      if (!byGroup.has(it.group)) byGroup.set(it.group, []);
      byGroup.get(it.group).push(it);
    });
    byGroup.forEach(function(arr, grp){
      html += '<div class="pgroup">' + esc(grp) + ' · ' + arr.length + '</div>';
      arr.forEach(function(it){ html += pRow(it, '', null); });
    });
    nMain = base.length;
  } else {
    var main = [], extra = [];
    base.forEach(function(it){
      var n = (it.name || '').toLowerCase(), id = it.id.toLowerCase(), grp = (it.group || '').toLowerCase();
      if (n.indexOf(kw) >= 0 || id.indexOf(kw) >= 0 || grp.indexOf(kw) >= 0){ main.push(it); return; }
      var hits = (it._ings || []).filter(function(g){ return g.toLowerCase().indexOf(kw) >= 0; });
      if (hits.length){ it._hit = hits; extra.push(it); }
    });
    main.sort(function(a, b){
      var an = a.name.toLowerCase().indexOf(kw) >= 0 ? 0 : 1;
      var bn = b.name.toLowerCase().indexOf(kw) >= 0 ? 0 : 1;
      return an !== bn ? an - bn : (a.id < b.id ? -1 : 1);
    });
    nMain = main.length; nIng = extra.length;
    if (main.length){
      html += '<div class="pgroup">产品名 / 编号 / 分组 · ' + main.length + '</div>';
      main.forEach(function(it){ html += pRow(it, kw, null); });
    }
    if (extra.length){
      html += '<div class="pgroup">含「' + esc(kw) + '」这个成分 · ' + extra.length + '</div>';
      extra.forEach(function(it){ html += pRow(it, '', it._hit); });
    }
    if (!main.length && !extra.length){
      html = '<div class="loading">没搜到「' + esc(kw) + '」<br><span style="font-size:12px">试试成分名（如「镁」「甘氨酸」）、产品或编号</span></div>';
    } else {
      html = '<div class="pcount">共 ' + (nMain + nIng) + ' 个结果' +
             (nIng ? '（其中 ' + nIng + ' 个是按成分命中的）' : '') + '</div>' + html;
    }
  }
  q('#plist').innerHTML = html || '<div class="loading">没找到</div>';
}

    if (img && img.tagName === 'IMG' && (img.dataset.casePrimary || img.id === 'caseLightboxImg')){
      delete img.dataset.caseTimer;
      img.dataset.caseFailed = '';
      img.hidden = false;
      var item = img.closest('.case-img-item');
      var retry = item && item.querySelector('.case-img-retry');
      if (retry) retry.hidden = true;
    }
  }, true);
  applyCaseFontSize(false);
  q('#aiPrompt').addEventListener('input', updateAICount);
  q('#aiReset').onclick = function(){
    q('#aiPrompt').value = aiDefaultPrompt;
    updateAICount();
    setAIStatus('', '已恢复默认提问稿。');
  };
  q('#aiCopy').onclick = function(){ copyAndOpenYuanbao(false); };
  q('#aiGo').onclick = function(){ copyAndOpenYuanbao(true); };
  var quickToggle = q('#quicknavToggle');
  quickToggle.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var nav = q('#quicknav'), r = nav.getBoundingClientRect();
    quickDrag = {
      pointerId: e.pointerId, startX: e.clientX, startY: e.clientY,
      offsetX: e.clientX - r.left, offsetY: e.clientY - r.top,
      left: r.left, top: r.top, moved: false
    };
    try{ if (quickToggle.setPointerCapture) quickToggle.setPointerCapture(e.pointerId); }catch(err){}
  });
  window.addEventListener('pointermove', function(e){
    if (!quickDrag || quickDrag.pointerId !== e.pointerId) return;
    var dx = e.clientX - quickDrag.startX, dy = e.clientY - quickDrag.startY;
    if (!quickDrag.moved && Math.sqrt(dx*dx + dy*dy) < 5) return;
    if (!quickDrag.moved){
      quickDrag.moved = true;
      setQuickNavOpen(false);
      q('#quicknav').classList.add('dragging');
    }
    e.preventDefault();
    quickDragPosition(e.clientX, e.clientY);
  }, {passive:false});
  window.addEventListener('pointerup', function(e){
    if (!quickDrag || quickDrag.pointerId !== e.pointerId) return;
    finishQuickDrag(false);
  });
  window.addEventListener('pointercancel', function(e){
    if (!quickDrag || quickDrag.pointerId !== e.pointerId) return;
    finishQuickDrag(true);
  });
  quickToggle.onclick = function(e){
    if (performance.now() < quickSuppressClickUntil){
      e.preventDefault(); e.stopPropagation(); return;
    }
    e.stopPropagation();
    setQuickNavOpen(!q('#quicknav').classList.contains('open'));
  };
  window.addEventListener('resize', function(){
    if (!quickDrag) applyQuickNavAnchor(quickNavAnchor, false);
  });
  q('#psearch').oninput = renderList;

  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-rm],[data-detail],[data-toggle],[data-quick-toggle],[data-quick],[data-qtab],[data-gap-el],[data-gap-add],[data-ai-product],[data-ai-combo],[data-case-product],[data-case-filter],[data-case-sort],[data-case-more],[data-case-img],[data-case-img-retry],[data-ingf],[data-step],[data-jump]') : null;
    if (!t) return;
    if (t.dataset.caseProduct){ openCaseSheet(t.dataset.caseProduct); return; }
    if (t.dataset.caseFilter && caseView){
      caseView.filter = t.dataset.caseFilter;
      caseView.shown = 5;
      renderCaseFilters();
      renderCaseList();
      q('#caseBody').scrollTop = 0;
      return;
    }
    if (t.dataset.caseSort && caseView){
      caseView.sort = t.dataset.caseSort === 'earliest' ? 'earliest' : 'latest';
      caseView.shown = 5;
      lsSet('cf_case_sort', caseView.sort);
      renderCaseSort();
      renderCaseList();
      q('#caseBody').scrollTop = 0;
      return;
    }
    if (t.hasAttribute('data-case-more') && caseView){
      caseView.shown += 5;
      renderCaseList();
      return;
    }
    if (t.hasAttribute('data-case-img-retry')){
      var imageItem = t.closest('.case-img-item');
      var retryImage = imageItem && imageItem.querySelector('img');
      if (retryImage){
        t.hidden = true;
        retryImage.hidden = false;
        retryImage.dataset.caseStage = 'primary';
        retryImage.dataset.caseFailed = '';
        retryImage.src = retryCaseImageUrl(retryImage.dataset.casePrimary);
        armCaseImageTimeout(retryImage);
      }
      return;
    }
    if (t.dataset.caseImg){ openCaseLightbox(t.dataset.caseImg, t); return; }
    if (t.dataset.aiProduct){ openAISheet('product', t.dataset.aiProduct); return; }
    if (t.hasAttribute('data-ai-combo')){ openAISheet('combo'); return; }
    if (t.dataset.gapEl){ handleGapCard(t.dataset.gapEl, parseFloat(t.dataset.gapMg)); return; }
    if (t.dataset.gapAdd && gapState){ addGapProduct(t.dataset.gapAdd, gapState.element, gapState.gapMg, true); return; }
    if (t.dataset.qtab){ setQuickNavTab(t.dataset.qtab); return; }
    if (t.dataset.quickToggle){ toggleQuickProduct(t.dataset.quickToggle); return; }
    if (t.dataset.jump){ jumpToSection(t.dataset.jump); return; }
    if (t.dataset.step){
      var id = t.dataset.step, dir = parseFloat(t.dataset.dir) || 1;
      var it = SEL.find(x=>x.id===id);
      if (it){
        var cur = (it.amount==null ? 0 : it.amount);
        var stp = cur >= 1 ? 1 : 0.1;
        it.amount = Math.max(0, Math.round((cur + dir*stp) * 1000) / 1000);
        renderChips(); render(); syncHash();
      }
      return;
    }
    if (t.dataset.rm){ rmP(t.dataset.rm); return; }
    if (t.dataset.detail){ openDetail(t.dataset.detail); return; }
    if (t.dataset.toggle){
      if (SEL.some(x=>x.id===t.dataset.toggle)) rmP(t.dataset.toggle);
      else addP(t.dataset.toggle);
      renderList(); return;
    }
    if (t.dataset.quick){ addP(t.dataset.quick); return; }
    if (t.dataset.ingf){ INGF = t.dataset.ingf; render(); return; }
    if (t.classList.contains('grp-hd')){
      var gp = t.parentNode; gp.dataset.open = gp.dataset.open==='1' ? '0' : '1';
    }
  });
  document.addEventListener('click', function(e){
    var nav = q('#quicknav');
    var path = e.composedPath ? e.composedPath() : [];
    var inNav = path.length ? path.indexOf(nav) >= 0 : !!(e.target.closest && e.target.closest('#quicknav'));
    if (!inNav) setQuickNavOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if (q('#caseLightbox').classList.contains('on')) closeCaseLightbox();
      else if (q('#caseSheet').classList.contains('on')) closeCaseSheet();
      setQuickNavOpen(false);
    }else if (q('#caseLightbox').classList.contains('on')){
      if (e.key === 'ArrowLeft') caseGalleryStep(-1);
      else if (e.key === 'ArrowRight') caseGalleryStep(1);
    }
  });
  document.addEventListener('input', function(e){
    var id = e.target.dataset && e.target.dataset.amt;
    if (id){
      var v = parseFloat(e.target.value);
      var it = SEL.find(x=>x.id===id);
      if (it){ it.amount = isNaN(v)? null : v; throttledRender(); }
    }
  });
})();

var rt = null;
function throttledRender(){
  if (rt) clearTimeout(rt);
  rt = setTimeout(function(){ render(); syncHash(); }, 220);
}
function syncHash(){
  try{
    if (!SEL.length){ history.replaceState(null,'',location.pathname+location.search); return; }
    var s = SEL.map(x=>x.id+':'+x.amount).join(',');
    history.replaceState(null,'','#s='+s);
  }catch(e){}
}
</script>
</body>
</html>
